server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression du texte. Les webp/mp4 sont déjà compressés : ne pas les repasser.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Les assets d'Astro portent un hash dans leur nom : immuables.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Médias : longue durée, mais révocable (les noms ne sont pas hashés).
  location /media/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # Le HTML doit toujours être revalidé, sinon une mise à jour
  # de maquette peut rester invisible chez le client.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
