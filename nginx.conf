# Démonstration statique : routes à slash final, vraie 404, cache prudent, jamais indexée
# (X-Robots-Tag en plus du meta robots et du robots.txt).
# Adresse du visiteur : derrière Cloudflare, CF-Connecting-IP (Traefik ne voit que l'IP de Cloudflare
# et la met dans X-Real-Ip) ; sinon X-Real-Ip posé par Traefik ; sinon celle de la connexion.
map $http_x_real_ip $ip_proxy { "" $remote_addr; default $http_x_real_ip; }
map $http_cf_connecting_ip $ip_visiteur { "" $ip_proxy; default $http_cf_connecting_ip; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off; # redirections relatives : pas de retour en http derrière le proxy HTTPS
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control "no-cache" always;
  error_page 404 /404.html;

  # Statistiques : le traceur et l'envoi d'Umami (instance du serveur clients) relayés depuis le domaine du site.
  # Inerte tant que site.config.json ne porte pas d'identifiant « umami » (aucune page n'appelle /stats/).
  # Deux adresses exactes, jamais le reste de l'API. Résolution à la requête : si Umami tombe,
  # seul /stats/ échoue. Umami lit l'IP dans X-Ip-Visiteur.
  location ~ ^/stats/(?<chemin_stats>script\.js|api/send)$ {
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $umami stats.noveo-digital.be;
    proxy_pass https://$umami/$chemin_stats;
    proxy_ssl_server_name on;
    proxy_ssl_name $umami;
    proxy_set_header Host $umami;
    proxy_set_header X-Ip-Visiteur $ip_visiteur;
    proxy_set_header Cookie "";
    # Umami est lui aussi derrière Cloudflare : les en-têtes posés par Cloudflare à l'entrée du site
    # ne doivent pas repartir (CF-Connecting-IP retransmis = « error code: 1000 », 403 ; CDN-Loop = boucle).
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CDN-Loop "";
    proxy_set_header CF-Ray "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header CF-Visitor "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-Ip "";
    proxy_hide_header Cache-Control;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }

  # /services → /services/ (le dossier existe) ; une adresse inconnue → 404.
  location / { try_files $uri $uri/ =404; }

  # Fichiers hachés par Astro : immuables.
  location ~* ^/_astro/.+\.(?:css|js|woff2?|png|jpe?g|webp|avif|svg)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  # Polices et médias publics à nom stable : une semaine.
  location ~ ^/(fonts|photos|a|b|c)/.+\.(?:woff2?|jpe?g|png|webp|avif|svg|mp4|webm)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location ~ /\. { deny all; }
}
