server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Ne pas annoncer la version de nginx.
  server_tokens off;

  # En-têtes de sécurité (contrôle qualité du 2026-09-09). ⚠️ Un add_header dans
  # un bloc location ANNULE ceux du bloc server : ils sont posés ici ET répétés
  # dans chaque location qui ajoute son propre add_header.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # HSTS : le TLS est terminé par le proxy Coolify/Traefik en amont ; l'en-tête
  # n'a d'effet qu'en HTTPS et reste inoffensif en HTTP.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Compression du texte. Les webp/mp4 sont déjà compressés : ne pas les repasser.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Les assets d'Astro portent un hash dans leur nom : immuables.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Médias : longue durée, mais révocable (les noms ne sont pas hashés).
  location /media/ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Le HTML doit toujours être revalidé, sinon une mise à jour
  # de maquette peut rester invisible chez le client.
  location ~ \.html$ {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Site multi-pages : une URL inconnue doit répondre 404 (pas de fallback SPA
  # qui servirait l'accueil en 200 — soft-404 pénalisant).
  error_page 404 /404.html;
  location / {
    try_files $uri $uri/ =404;
  }
}
